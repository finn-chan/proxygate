name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: edge
        type: string
      version:
        description: Version embedded in the binary; leave empty to use Makefile
        required: false
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build${{ github.event_name == 'pull_request' && ' (verify only)' || ' and publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        id: build_meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          project_version() {
            local major minor patch
            major="$(awk '$1 == "CURRENT_VERSION_MAJOR" { print $3 }' Makefile)"
            minor="$(awk '$1 == "CURRENT_VERSION_MINOR" { print $3 }' Makefile)"
            patch="$(awk '$1 == "CURRENT_VERSION_PATCH" { print $3 }' Makefile)"
            printf '%s.%s.%s-dev' "$major" "$minor" "$patch"
          }

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION:-$(project_version)}"
            if [[ ! "$INPUT_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "image_tag is not a valid container tag" >&2
              exit 1
            fi
          else
            version="$(project_version)"
          fi

          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "version must use semantic version format, for example 0.1.0 or 0.1.0-rc.1" >&2
            exit 1
          fi

          echo "version_major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version_minor=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "version_patch=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          echo "version_pre_release=${BASH_REMATCH[5]}" >> "$GITHUB_OUTPUT"
          echo "build_commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          pull: true
          build-args: |
            VERSION_MAJOR=${{ steps.build_meta.outputs.version_major }}
            VERSION_MINOR=${{ steps.build_meta.outputs.version_minor }}
            VERSION_PATCH=${{ steps.build_meta.outputs.version_patch }}
            VERSION_PRE_RELEASE=${{ steps.build_meta.outputs.version_pre_release }}
            BUILD_CHANNEL=github-actions-docker
            BUILD_COMMIT=${{ steps.build_meta.outputs.build_commit }}
            BUILD_TIMESTAMP=${{ steps.build_meta.outputs.build_timestamp }}
          cache-from: type=gha,scope=proxygate-docker
          cache-to: type=gha,mode=max,scope=proxygate-docker
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Add build summary
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published Docker image"
            echo
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo
            echo "Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
